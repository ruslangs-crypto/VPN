# SSTP VPN Server Configuration
# Этот файл содержит настройки VPN-сервера.
# Измените значения перед запуском setup-sstp.sh

# --- Сеть ---
VPN_PORT=443
VPN_SUBNET="10.10.0.0"
VPN_SUBNET_MASK="255.255.255.0"
VPN_GATEWAY="10.10.0.1"

# --- DHCP ---
DHCP_START="10.10.0.10"
DHCP_END="10.10.0.200"
DHCP_LEASE_TIME=7200

# --- DNS ---
DNS_PRIMARY="8.8.8.8"
DNS_SECONDARY="8.8.4.4"

# --- VPN Hub ---
HUB_NAME="VPN"

# --- SSL ---
# Для продакшена замените на сертификат от CA (Let's Encrypt и т.д.)
SSL_CERT_PATH="/etc/sstp-vpn/certs/server.crt"
SSL_KEY_PATH="/etc/sstp-vpn/certs/server.key"

# --- Логирование ---
LOG_ENABLED=yes
LOG_DIR="/var/log/sstp-vpn"

# --- Безопасность ---
MAX_CONNECTIONS=128
SESSION_TIMEOUT=3600
